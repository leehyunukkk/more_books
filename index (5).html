<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>more books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3;
    --ink:#161615;
    --muted:#8f8d86;
    --hairline:#e2e0da;
    --panel:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  img{display:block; max-width:100%;}
  .serif{ font-family:'Fraunces', serif; }

  /* ---------- HEADER ---------- */
  header{
    padding:40px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header .wordmark{
    display:block;
    height:44px;
    width:auto;
  }
  header .index{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.02em;
  }

  /* ---------- INTRO SPACE ---------- */
  .lede{
    padding:64px 40px 96px;
    max-width:640px;
  }

  /* ---------- WORKS (grid) ---------- */
  .works-wrap{
    max-width:1200px;
    margin:0 auto;
    padding:0 40px 24px;
  }
  .works{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:3px;
  }
  .work{
    position:relative;
    aspect-ratio:1 / 1;
    overflow:hidden;
    cursor:pointer;
    background:var(--panel);
  }
  .work img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform 0.6s cubic-bezier(.2,.7,.2,1);
  }
  .work:hover img{ transform:scale(1.05); }
  .work .num{
    position:absolute; left:10px; bottom:10px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:13px;
    color:#fff;
    opacity:0;
    transition:opacity 0.3s;
    text-shadow:0 1px 6px rgba(0,0,0,0.5);
  }
  .work:hover .num{ opacity:1; }

  /* ---------- PAGINATION ---------- */
  .pagination{
    display:flex; align-items:center; justify-content:center;
    gap:20px;
    padding:32px 40px 80px;
  }
  .pagination button{
    background:none; border:none; cursor:pointer;
    font-family:'Fraunces', serif; font-style:italic;
    font-size:15px; color:var(--ink);
    padding:4px 6px;
  }
  .pagination button:disabled{ color:var(--hairline); cursor:default; }
  .pagination button.page-num{ color:var(--muted); font-style:normal; }
  .pagination button.page-num.active{ color:var(--ink); text-decoration:underline; text-underline-offset:4px; }
  .pagination button:not(:disabled):hover{ opacity:0.6; }

  /* ---------- FOOTER ---------- */
  footer{
    padding:64px 40px 56px;
    border-top:1px solid var(--hairline);
    display:flex; align-items:baseline; justify-content:space-between;
    color:var(--muted);
    font-size:12px;
  }
  footer a{ color:var(--muted); text-decoration:none; border-bottom:1px solid var(--hairline); }
  footer a:hover{ color:var(--ink); border-color:var(--ink); }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:200;
    background:var(--bg);
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    padding:56px 32px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:min(1400px, 92vw); max-height:80vh;
    width:auto; height:auto;
    object-fit:contain;
  }
  .lightbox .lb-index{
    margin-top:20px;
    font-family:'Fraunces', serif; font-style:italic;
    font-size:14px; color:var(--muted);
  }
  .lightbox .lb-close, .lightbox .lb-prev, .lightbox .lb-next{
    position:absolute;
    background:none; border:none;
    color:var(--ink);
    font-family:'Fraunces', serif;
    font-size:15px;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  .lightbox .lb-close{ top:32px; right:40px; }
  .lightbox .lb-prev{ left:40px; top:50%; transform:translateY(-50%); font-size:28px; }
  .lightbox .lb-next{ right:40px; top:50%; transform:translateY(-50%); font-size:28px; }
  .lightbox .lb-close:hover, .lightbox .lb-prev:hover, .lightbox .lb-next:hover{ opacity:0.55; }

  /* ---------- SOUND TOGGLE ---------- */
  .sound-toggle{
    position:fixed;
    right:24px; bottom:24px;
    width:42px; height:42px;
    border-radius:9999px;
    border:1px solid var(--hairline);
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:150;
    transition:border-color 0.25s, transform 0.15s;
  }
  .sound-toggle:hover{ border-color:var(--ink); }
  .sound-toggle:active{ transform:scale(0.94); }
  .sound-toggle svg{ width:14px; height:14px; }
  .sound-toggle svg path, .sound-toggle svg rect{ fill:var(--ink); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:640px){
    header{ padding:24px; }
    header .wordmark{ height:32px; }
    .lede{ padding:40px 20px 64px; }
    .works-wrap{ padding:0 2px 24px; }
    .works{ grid-template-columns:repeat(3, 1fr); gap:2px; }
    .pagination{ padding:24px 20px 56px; gap:14px; }
    footer{ padding:48px 20px 40px; flex-direction:column; gap:16px; }
    .lightbox .lb-prev{ left:16px; }
    .lightbox .lb-next{ right:16px; }
    .lightbox .lb-close{ right:20px; top:20px; }
    .sound-toggle{ right:16px; bottom:16px; width:38px; height:38px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>

  <header>
    <a href="#top"><img class="wordmark" src="logo/more-books-logo.png" alt="more books"></a>
    <span class="index" id="header-count"></span>
  </header>

  <main id="top">
    <div class="works-wrap">
      <section class="works" id="works"></section>
    </div>
    <nav class="pagination" id="pagination"></nav>
  </main>

  <footer>
    <span>© 2026 more books</span>
    <a href="#top">맨 위로</a>
  </footer>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lb-close" aria-label="닫기">close</button>
    <button class="lb-prev" id="lb-prev" aria-label="이전 사진">‹</button>
    <img id="lb-image" src="" alt="">
    <div class="lb-index serif" id="lb-index"></div>
    <button class="lb-next" id="lb-next" aria-label="다음 사진">›</button>
  </div>

  <audio id="bgm" src="audio/track.mp3" loop preload="none"></audio>
  <button class="sound-toggle" id="sound-toggle" aria-label="음악 재생">
    <svg id="icon-play" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M3 2l11 6-11 6V2z"/></svg>
    <svg id="icon-pause" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" style="display:none"><rect x="3" y="2" width="3.4" height="12"/><rect x="9.6" y="2" width="3.4" height="12"/></svg>
  </button>

<script>
  /* =========================================================
     사진 목록 — 여기만 바꾸면 갤러리 전체가 업데이트됩니다.
     full : 화면에 크게 보이는 고화질 원본 (photos/full 폴더)
     caption: 작품명/설명 (선택, 비워두면 표시 안 됨)
     새 사진을 추가하려면 photos/full 폴더에 파일을 넣고
     아래 배열에 한 줄 추가하면 됩니다.
     ========================================================= */
  /* =========================================================
     사진 목록은 이제 photos/manifest.json 에서 자동으로 불러옵니다.
     사진을 추가/삭제하려면 photos/full 폴더에 파일만 넣고 빼면 됩니다.
     (GitHub에 올리면 워크플로우가 manifest.json을 자동으로 갱신해줍니다)
     ========================================================= */
  async function loadPhotos(){
    try{
      const res = await fetch('photos/manifest.json', { cache: 'no-store' });
      if(!res.ok) throw new Error('manifest not found');
      const files = await res.json();
      return files.map(f => ({ full: 'photos/full/' + f, caption: '' }));
    }catch(err){
      console.error('사진 목록을 불러오지 못했습니다:', err);
      return [];
    }
  }

  const worksEl = document.getElementById('works');
  const paginationEl = document.getElementById('pagination');

  function pad(n){ return String(n).padStart(2,'0'); }

  const PAGE_SIZE = 9; // 3x3
  let photos = [];
  let currentPage = 1;

  function renderPage(page){
    currentPage = page;
    const totalPages = Math.max(1, Math.ceil(photos.length / PAGE_SIZE));
    const start = (page - 1) * PAGE_SIZE;
    const pagePhotos = photos.slice(start, start + PAGE_SIZE);

    worksEl.innerHTML = '';
    pagePhotos.forEach((p, idxInPage) => {
      const globalIndex = start + idxInPage;
      const cell = document.createElement('div');
      cell.className = 'work';
      cell.innerHTML = `
        <img src="${p.full}" alt="${p.caption || 'photo ' + pad(globalIndex+1)}" loading="lazy">
        <span class="num">No. ${pad(globalIndex+1)}</span>
      `;
      cell.addEventListener('click', () => openLightbox(globalIndex));
      worksEl.appendChild(cell);
    });

    renderPagination(totalPages);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function renderPagination(totalPages){
    paginationEl.innerHTML = '';
    if(totalPages <= 1) return;

    const prevBtn = document.createElement('button');
    prevBtn.textContent = '‹ prev';
    prevBtn.disabled = currentPage === 1;
    prevBtn.addEventListener('click', () => renderPage(currentPage - 1));
    paginationEl.appendChild(prevBtn);

    for(let i = 1; i <= totalPages; i++){
      const btn = document.createElement('button');
      btn.className = 'page-num' + (i === currentPage ? ' active' : '');
      btn.textContent = i;
      btn.addEventListener('click', () => renderPage(i));
      paginationEl.appendChild(btn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.textContent = 'next ›';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.addEventListener('click', () => renderPage(currentPage + 1));
    paginationEl.appendChild(nextBtn);
  }

  (async () => {
    photos = await loadPhotos();
    document.getElementById('header-count').textContent = photos.length + ' works';
    renderPage(1);
  })();

  // ---------- Lightbox ----------
  const lightbox = document.getElementById('lightbox');
  const lbImage = document.getElementById('lb-image');
  const lbIndex = document.getElementById('lb-index');
  let currentIndex = 0;

  function openLightbox(i){
    currentIndex = i;
    updateLightbox();
    lightbox.classList.add('open');
  }
  function updateLightbox(){
    const p = photos[currentIndex];
    lbImage.src = p.full;
    lbImage.alt = p.caption || '';
    lbIndex.textContent = 'No. ' + pad(currentIndex+1) + ' — ' + pad(photos.length);
  }
  function closeLightbox(){ lightbox.classList.remove('open'); }
  function nextPhoto(){ currentIndex = (currentIndex + 1) % photos.length; updateLightbox(); }
  function prevPhoto(){ currentIndex = (currentIndex - 1 + photos.length) % photos.length; updateLightbox(); }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-next').addEventListener('click', nextPhoto);
  document.getElementById('lb-prev').addEventListener('click', prevPhoto);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') nextPhoto();
    if(e.key === 'ArrowLeft') prevPhoto();
  });

  // ---------- Background music toggle ----------
  const bgm = document.getElementById('bgm');
  const soundToggle = document.getElementById('sound-toggle');
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');

  soundToggle.addEventListener('click', () => {
    if(bgm.paused){
      bgm.play().catch(() => {});
    }else{
      bgm.pause();
    }
  });
  bgm.addEventListener('play', () => {
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
  });
  bgm.addEventListener('pause', () => {
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
  });
</script>

</body>
</html>
