name: Deploy site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate photo manifest
        run: |
          python3 - <<'PY'
          import json, os

          folder = 'photos/full'
          exts = ('.jpg', '.jpeg', '.png', '.webp')
          files = sorted(
              f for f in os.listdir(folder)
              if f.lower().endswith(exts)
          )

          with open('photos/manifest.json', 'w') as fp:
              json.dump(files, fp, ensure_ascii=False, indent=2)

          print('manifest.json generated with', len(files), 'photos:')
          print(files)
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
