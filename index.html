<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>more books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3;
    --ink:#161615;
    --muted:#8f8d86;
    --hairline:#e2e0da;
    --panel:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  img{display:block; max-width:100%;}
  .serif{ font-family:'Fraunces', serif; }

  /* ---------- HEADER ---------- */
  header{
    padding:48px 40px 0;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header .wordmark{
    display:block;
    height:26px;
    width:auto;
  }
  header .index{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.02em;
  }

  /* ---------- INTRO SPACE ---------- */
  .lede{
    padding:64px 40px 96px;
    max-width:640px;
  }

  /* ---------- WORKS ---------- */
  .works{
    display:flex; flex-direction:column;
  }
  .work{
    padding:88px 40px;
    border-top:1px solid var(--hairline);
    display:flex; flex-direction:column; align-items:center;
  }
  .work:first-child{ border-top:none; }
  .work .frame{
    width:100%;
    max-width:1040px;
    cursor:pointer;
    overflow:hidden;
    background:var(--panel);
  }
  .work img{
    width:100%; height:auto; display:block;
    transition:transform 1.1s cubic-bezier(.2,.7,.2,1);
  }
  .work .frame:hover img{ transform:scale(1.015); }
  .work .meta{
    width:100%; max-width:1040px;
    display:flex; align-items:baseline; justify-content:space-between;
    margin-top:22px;
  }
  .work .meta .num{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:15px;
    color:#c17a0a;
  }
  .work .meta .cap{
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.01em;
  }

  /* ---------- FOOTER ---------- */
  footer{
    padding:64px 40px 56px;
    border-top:1px solid var(--hairline);
    display:flex; align-items:baseline; justify-content:space-between;
    color:var(--muted);
    font-size:12px;
  }
  footer a{ color:var(--muted); text-decoration:none; border-bottom:1px solid var(--hairline); }
  footer a:hover{ color:var(--ink); border-color:var(--ink); }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:200;
    background:var(--bg);
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    padding:56px 32px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:min(1400px, 92vw); max-height:80vh;
    width:auto; height:auto;
    object-fit:contain;
  }
  .lightbox .lb-index{
    margin-top:20px;
    font-family:'Fraunces', serif; font-style:italic;
    font-size:14px; color:var(--muted);
  }
  .lightbox .lb-close, .lightbox .lb-prev, .lightbox .lb-next{
    position:absolute;
    background:none; border:none;
    color:var(--ink);
    font-family:'Fraunces', serif;
    font-size:15px;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  .lightbox .lb-close{ top:32px; right:40px; }
  .lightbox .lb-prev{ left:40px; top:50%; transform:translateY(-50%); font-size:28px; }
  .lightbox .lb-next{ right:40px; top:50%; transform:translateY(-50%); font-size:28px; }
  .lightbox .lb-close:hover, .lightbox .lb-prev:hover, .lightbox .lb-next:hover{ opacity:0.55; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:640px){
    header{ padding:32px 20px 0; }
    .lede{ padding:40px 20px 64px; }
    .work{ padding:56px 20px; }
    footer{ padding:48px 20px 40px; flex-direction:column; gap:16px; }
    .lightbox .lb-prev{ left:16px; }
    .lightbox .lb-next{ right:16px; }
    .lightbox .lb-close{ right:20px; top:20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>

  <header>
    <a href="#top"><img class="wordmark" src="logo/more-books-logo.png" alt="more books"></a>
    <span class="index" id="header-count"></span>
  </header>

  <main id="top">
    <section class="works" id="works"></section>
  </main>

  <footer>
    <span>© 2026 more books</span>
    <a href="#top">맨 위로</a>
  </footer>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lb-close" aria-label="닫기">close</button>
    <button class="lb-prev" id="lb-prev" aria-label="이전 사진">‹</button>
    <img id="lb-image" src="" alt="">
    <div class="lb-index serif" id="lb-index"></div>
    <button class="lb-next" id="lb-next" aria-label="다음 사진">›</button>
  </div>

<script>
  /* =========================================================
     사진 목록 — 여기만 바꾸면 갤러리 전체가 업데이트됩니다.
     full : 화면에 크게 보이는 고화질 원본 (photos/full 폴더)
     caption: 작품명/설명 (선택, 비워두면 표시 안 됨)
     새 사진을 추가하려면 photos/full 폴더에 파일을 넣고
     아래 배열에 한 줄 추가하면 됩니다.
     ========================================================= */
  /* =========================================================
     사진 목록은 이제 photos/manifest.json 에서 자동으로 불러옵니다.
     사진을 추가/삭제하려면 photos/full 폴더에 파일만 넣고 빼면 됩니다.
     (GitHub에 올리면 워크플로우가 manifest.json을 자동으로 갱신해줍니다)
     ========================================================= */
  async function loadPhotos(){
    try{
      const res = await fetch('photos/manifest.json', { cache: 'no-store' });
      if(!res.ok) throw new Error('manifest not found');
      const files = await res.json();
      return files.map(f => ({ full: 'photos/full/' + f, caption: '' }));
    }catch(err){
      console.error('사진 목록을 불러오지 못했습니다:', err);
      return [];
    }
  }

  const worksEl = document.getElementById('works');

  function pad(n){ return String(n).padStart(2,'0'); }

  let photos = [];

  (async () => {
    photos = await loadPhotos();
    document.getElementById('header-count').textContent = photos.length + ' works';

    photos.forEach((p, i) => {
      const section = document.createElement('div');
      section.className = 'work';
      section.innerHTML = `
        <div class="frame">
          <img src="${p.full}" alt="${p.caption || 'photo ' + pad(i+1)}" loading="lazy">
        </div>
        <div class="meta">
          <span class="num">No. ${pad(i+1)}</span>
          <span class="cap">${p.caption || ''}</span>
        </div>
      `;
      section.querySelector('.frame').addEventListener('click', () => openLightbox(i));
      worksEl.appendChild(section);
    });
  })();

  // ---------- Lightbox ----------
  const lightbox = document.getElementById('lightbox');
  const lbImage = document.getElementById('lb-image');
  const lbIndex = document.getElementById('lb-index');
  let currentIndex = 0;

  function openLightbox(i){
    currentIndex = i;
    updateLightbox();
    lightbox.classList.add('open');
  }
  function updateLightbox(){
    const p = photos[currentIndex];
    lbImage.src = p.full;
    lbImage.alt = p.caption || '';
    lbIndex.textContent = 'No. ' + pad(currentIndex+1) + ' — ' + pad(photos.length);
  }
  function closeLightbox(){ lightbox.classList.remove('open'); }
  function nextPhoto(){ currentIndex = (currentIndex + 1) % photos.length; updateLightbox(); }
  function prevPhoto(){ currentIndex = (currentIndex - 1 + photos.length) % photos.length; updateLightbox(); }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-next').addEventListener('click', nextPhoto);
  document.getElementById('lb-prev').addEventListener('click', prevPhoto);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') nextPhoto();
    if(e.key === 'ArrowLeft') prevPhoto();
  });
</script>

</body>
</html>
