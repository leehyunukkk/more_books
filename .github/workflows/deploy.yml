name: Deploy site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate photo manifest (newest upload first)
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          folder = 'photos/full'
          exts = ('.jpg', '.jpeg', '.png', '.webp')
          files = [
              f for f in os.listdir(folder)
              if f.lower().endswith(exts)
          ]

          def last_commit_time(filename):
              path = os.path.join(folder, filename)
              result = subprocess.run(
                  ['git', 'log', '-1', '--format=%ct', '--', path],
                  capture_output=True, text=True
              )
              value = result.stdout.strip()
              return int(value) if value else 0

          # newest upload (most recent commit touching the file) first
          files.sort(key=last_commit_time, reverse=True)

          with open('photos/manifest.json', 'w') as fp:
              json.dump(files, fp, ensure_ascii=False, indent=2)

          print('manifest.json generated with', len(files), 'photos (newest first):')
          print(files)
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
